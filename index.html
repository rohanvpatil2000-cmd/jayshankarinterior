<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jayshankar Interior | Under Maintenance</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#111;
      color:white;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:20px;
      overflow:hidden;
    }

    .container{
      max-width:700px;
      animation:fadeIn 1.2s ease;
    }

    h1{
      font-size:52px;
      margin-bottom:20px;
      color:#d4a373;
      letter-spacing:1px;
    }

    p{
      font-size:20px;
      line-height:1.8;
      color:#ddd;
      margin-bottom:25px;
    }

    .btn{
      display:inline-block;
      padding:15px 30px;
      background:#d4a373;
      color:white;
      text-decoration:none;
      border-radius:10px;
      font-size:18px;
      transition:0.3s ease;
      box-shadow:0 8px 25px rgba(212,163,115,0.3);
    }

    .btn:hover{
      background:#b87c4c;
      transform:translateY(-3px);
    }

    .logo{
      font-size:18px;
      letter-spacing:5px;
      color:#999;
      margin-bottom:25px;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @media(max-width:768px){

      h1{
        font-size:36px;
      }

      p{
        font-size:17px;
      }

      .btn{
        width:100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      JAYSHANKAR INTERIOR
    </div>

    <h1>Website Under Maintenance</h1>

    <p>
      We are currently upgrading our website with premium interior
      showcases, improved galleries, modern design features,
      and enhanced enquiry services.
    </p>

    <p>
      Our new experience will be live shortly.
    </p>

    <a href="https://wa.me/919765261313" class="btn">
      Contact on WhatsApp
    </a>

  </div>

</body>
</html>
